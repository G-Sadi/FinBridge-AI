name: Deploy FinBridge AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build frontend
        run: |
          if [ -d "FinBridge-AI-Advisor/frontend" ]; then
            cd FinBridge-AI-Advisor/frontend
          elif [ -d "frontend" ]; then
            cd frontend
          fi
          echo "Current directory: $(pwd)"
          npm ci || npm install
          npm run build
          mkdir -p $GITHUB_WORKSPACE/deploy-dist
          cp -r dist/* $GITHUB_WORKSPACE/deploy-dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
